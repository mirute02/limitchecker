import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
}

// 署名設定は keystore.properties から読む。鍵もパスワードもリポジトリに入れない。
// ファイルが無ければ release は署名されない（debug ビルドには影響しない）。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = 'com.limitchecker'
    compileSdk 37
    defaultConfig {
        applicationId "com.limitchecker"
        minSdk 31
        targetSdk 37
        versionCode 2
        versionName "0.2.0"
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
    }
}

dependencies {
    // 依存は最小限にする。HTTP は HttpURLConnection、画面は素の Activity で足りる。
    // 公開リポジトリとして、監査対象が少ないほうがよい。
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
}
